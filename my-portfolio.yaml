# ==============================================================================
# DADAIC Investment Firm - Investor Profile & Portfolio Holdings Configuration
# 투자자 프로필 및 보유 포트폴리오 설정 파일 (Bilingual / 영문 & 한글)
# ==============================================================================
# Set your profile and current asset allocations here.
# The CIO Orchestrator and Portfolio Manager will automatically load this data.
# 본 파일에 투자 성향과 보유 종목을 설정하면 분석 시 자동으로 반영됩니다.
# ==============================================================================

# 1. Investor Profile / 투자자 프로필
investor_profile:
  # Investor Name & Title / 투자자 존칭:
  investor_name: "BM사장님"

  # Investment Horizon / 투자 시계열: Short-term (<1y) / Medium-term (3-5y) / Long-term (10y+)
  # 단기 (<1년) / 중기 (3~5년) / 장기 (10년 이상)
  investment_horizon: "Long-term (10+ years) / 장기 투자 (10년 이상)"

  # Risk Tolerance / 위험 감수 성향: Conservative / Moderate / Growth / Aggressive
  # 안정형 / 중립형 / 적극투자형 (Growth) / 공격투자형
  # BM사장님의 경우 "Growth (High Risk Tolerance) / 적극투자형"
  risk_tolerance: "Aggressive / 공격투자형"

  # Primary Objective / 핵심 투자 목표: Capital Appreciation / Steady Dividends / Inflation Hedge
  # 장기 복리 자산 증식 / 안정적 배당 현금흐름 / 인플레이션 헤지
  primary_objective: "Long-term Capital Compounding & Alpha / 장기 복리 자산 증식 및 초과 수익 추구"

  # Maximum Single Stock Allocation Ceiling (%) / 단일 종목 최대 편입 한도 (%)
  max_single_stock_weight: 25.0

  # Strategic Notes / 특이사항 및 원칙
  notes: "Tolerate 20-30% short-term volatility, but strictly avoid permanent loss of capital / 단기 20-30% 변동성은 감내하나 영구적 자본 손실은 철저히 회피"


# 2. Portfolio Summary / 포트폴리오 요약
portfolio_summary:
  # Total Portfolio Assets in USD (Optional, percentage weights suffice) / 총 운용 자산 규모 (선택사항)
  total_portfolio_value_usd:

  # Cash & Liquid Equivalent Allocation (%) / 현금 및 단기 금융상품 비중 (%)
  cash_allocation_percent:

  # Base Currency / 기준 통화
  base_currency: "USD"


